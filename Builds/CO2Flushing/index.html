<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>BCIT | 3D Activity Viewer</title>
    <link
      rel="shortcut icon"
      href="https://learn.bcit.ca/shared/scripts/interactive/UnityModelViewerTemplateData/bcit_cmyk.ico"
    />
    <link 
      rel="stylesheet" 
      href="https://learn.bcit.ca/shared/scripts/bootstrap-3.1.1/css/bootstrap.min.css" 
    />
    
    <!-- APP SRC: update in Unity project template html -->
    <base href="../../" />
    <link href="Builds/CO2Flushing/custom.css" rel="stylesheet"/>
    <script src="src/bundle.js" type="text/javascript"></script> 

    <!-- custom scripts -->
    <link href="src/bundle.css" rel="stylesheet"/>
    <script src="Builds/CO2Flushing/system_menu.js" type="text/javascript"></script>
       
  </head>

  <body class="d2l-edittable">

    <div id="system_panel">
      <!-- System panel Main menu -->
      <section id="system_main_menu" class="panel_page ">
        <div id="bubble1_btn" class="panel_area btn" onclick="showPanel('system_bubble1')">
          <h3>Bubble 1</h3>
          <div class="panel_box">
            <span></span>
            <span></span>
            <span style="flex: 0.5"></span>
            <span style="flex: 3"></span>
          </div>
        </div>
        <div id="level1_btn" class="panel_area btn" onclick="showPanel('system_level1')">
          <h3>Level 1</h3>
          <div class="panel_box">
            <span></span>
            <span style="flex: 3"></span>
          </div>
        </div>
      </section>

      <!-- Submenus Level1 -->
      <section id="system_level1" class="panel_page submenu inactive">
          <div class="panel_header">
            <h3>Level 1 Menu</h3>
          </div>
          <div id="level1_menu" class="panel_area">
            <div class="panel_box">
              <button class="btn" style="flex: 3">Controlled pump</button>
              <span class="status_text">arterial (4)</span>
            </div>
            <div class="panel_box">
              <button class="btn" style="flex: 3">Level control</button>
              <span class="status_text">On</span>
            </div>
            <div class="panel_box">
              <button class="btn" style="flex: 3" onclick="showPanel('system_level1_function')">Function</button>
              <span class="status_text">Off</span>
            </div>
          </div>
          <div class="panel_footer">
            <button id="pages_btm" class="btn" title="More pages">📚</button>
            <button id="back_btn" class="btn" title="Save" onclick="showPanel('system_main_menu')">✔️</button>
          </div>
      </section>
      <section id="system_level1_function" class="panel_page submenu pg2 inactive">
          <div class="panel_header">
            <h3>Level 1 / Function</h3>
          </div>
          <div id="level1_function_menu" class="panel_area">
            <div class="panel_box list">
              <select id="level1_function_status" class="form-control">
                <option>On</option>
                <option selected>Off</option>
              </select>
            </div>
            
          </div>
        <div class="panel_footer">
          <button id="close_btn" class="btn" title="Close" onclick="showPanel('system_level1')">❌</button>
          <button id="back_btn" class="btn" title="Save" onclick="showPanel('system_level1')">✔️</button>
          </div>
      </section>

      <!-- Submenus Bubble1  -->
      <section id="system_bubble1" class="panel_page submenu inactive">
          <div class="panel_header">
            <h3>Bubble 1 Menu</h3>
          </div>
          <div id="bubble1_menu" class="panel_area">
            <div class="panel_box">
              <button class="btn" style="flex: 3">Controlled pump</button>
              <span class="status_text">arterial (4)</span>
            </div>
            <div class="panel_box">
              <button class="btn" style="flex: 3" onclick="showPanel('system_bubble1_threshold')">Threshold bubble alarm</button>
              <span class="status_text">Off</span>
            </div>
            <div class="panel_box">
              <button class="btn" style="flex: 3">Warning tone micro-bubbles</button>
              <span class="status_text">Off</span>
            </div>
          </div>
          <div class="panel_footer">
            <button id="pages_btm" class="btn" title="More pages">📚</button>
            <button id="back_btn" class="btn" title="Save" onclick="showPanel('system_main_menu')">✔️</button>
          </div>
      </section>
      <section id="system_bubble1_threshold" class="panel_page submenu pg2 inactive">
          <div class="panel_header">
            <h3>Bubble 1 / Threshold</h3>
          </div>
          <div id="bubble1_threshold_menu" class="panel_area">
            <div class="panel_box list">
              <select id="bubble1_threshold_status" class="form-control">
                <option>Large</option>
                <option>Medium</option>
                <option>Small</option>
                <option>Small 1/4"</option>
                <option selected>Off</option>
              </select>
            </div>
            
          </div>
        <div class="panel_footer">
          <button id="close_btn" class="btn" title="Close" onclick="showPanel('system_bubble1')">❌</button>
          <button id="back_btn" class="btn" title="Save" onclick="showPanel('system_bubble1')">✔️</button>
          </div>
      </section>      
    </div>
   
  </body>
</html>
